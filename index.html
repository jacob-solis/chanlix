  *{box-sizing:border-box}
  html,body{margin:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    font-family:"Nunito",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#f3f0ff 0%,#fff0f4 52%,#fff7ef 100%);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;
    padding:0 20px 56px;
  }

  /* flowing "waterfall" gradient behind everything */
  .flow{position:fixed;left:0;right:0;top:-100vh;height:300vh;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,
      #eef0ff 0%, #ffe7ef 11.11%, #fff2e4 22.22%,
      #eef0ff 33.33%, #ffe7ef 44.44%, #fff2e4 55.55%,
      #eef0ff 66.66%, #ffe7ef 77.77%, #fff2e4 88.88%, #eef0ff 100%);
    animation:waterfall 4.5s linear infinite;will-change:transform}
  @keyframes waterfall{from{transform:translateY(0)}to{transform:translateY(100vh)}}

  /* falling pastel hearts — confined to a band over the header, fading out at its base */
  .hearts{position:absolute;top:0;left:0;right:0;height:600px;z-index:5;pointer-events:none;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 60%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 0%,#000 60%,transparent 100%)}
  .heart{position:absolute;top:0;will-change:transform;animation:fall linear infinite}
  .heart svg{display:block;width:100%;height:100%;animation:sway ease-in-out infinite alternate;
    filter:drop-shadow(0 2px 3px rgba(120,100,160,.20))}
  @keyframes fall{from{transform:translateY(-44px)}to{transform:translateY(calc(var(--h,600px) + 60px))}}
  @keyframes sway{from{transform:translateX(-9px) rotate(-14deg)}to{transform:translateX(9px) rotate(14deg)}}

  /* soft floating background blobs */
  .blob{position:fixed;border-radius:50%;filter:blur(46px);opacity:.5;z-index:0;pointer-events:none}
  .blob.b1{width:300px;height:300px;background:#cdd4ff;top:-90px;left:-70px;animation:float 14s ease-in-out infinite}
  .blob.b2{width:260px;height:260px;background:#ffd2de;top:120px;right:-80px;animation:float 18s ease-in-out infinite reverse}
  .blob.b3{width:240px;height:240px;background:#ffe7c7;bottom:-80px;left:30%;animation:float 16s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-22px) translateX(12px)}}

  .wrap{position:relative;z-index:1;width:100%;max-width:540px}

  /* header — photo banner */
  header{
    position:relative;overflow:hidden;text-align:center;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    aspect-ratio:1/1;min-height:300px;
    margin:26px 0 10px;padding:0 24px 32px;border-radius:26px;
    background:var(--bg-image) var(--bg-pos)/cover no-repeat,
               linear-gradient(120deg,var(--peri),var(--coral));
    box-shadow:0 16px 38px -22px rgba(80,70,140,.55);
  }
  header::before{content:"";position:absolute;inset:0;
    background:linear-gradient(to top,
      rgba(34,28,54, calc(var(--scrim) + 0.18)) 0%,
      rgba(34,28,54, calc(var(--scrim) * 0.55)) 32%,
      rgba(34,28,54, 0) 64%)}
  header > *{position:relative;z-index:1}
  .mark{
    font-family:"Fredoka",sans-serif;font-weight:700;
    font-size:clamp(46px,13vw,68px);line-height:1;letter-spacing:-.01em;
    color:#fff;-webkit-text-fill-color:#fff;
    text-shadow:0 2px 16px rgba(0,0,0,.28);
    margin:0;
  }
  .mark .dot{color:#ffd0dc;-webkit-text-fill-color:#ffd0dc}
  .tag{margin:12px 0 0;color:rgba(255,255,255,.94);font-size:16px;font-weight:600;
    text-shadow:0 1px 10px rgba(0,0,0,.25)}
  .tag .spark{color:#ffe3a3}

  /* cards */
  .sites{display:flex;flex-direction:column;gap:14px;margin-top:8px}
  .card{
    display:flex;align-items:center;gap:15px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;box-shadow:0 12px 30px -20px rgba(80,70,140,.5);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  }
  .card:not(.archived):hover{transform:translateY(-3px);box-shadow:0 20px 38px -20px rgba(80,70,140,.55);border-color:#e0d8f3}
  .card:focus-visible{outline:3px solid var(--peri);outline-offset:2px}
  .tile{
    width:52px;height:52px;flex-shrink:0;border-radius:16px;display:grid;place-items:center;
    font-size:26px;background:linear-gradient(150deg,#f1f0ff,#ffeef3);border:1px solid var(--line);
    transition:transform .2s ease;
  }
  .card:not(.archived):hover .tile{transform:scale(1.08) rotate(-4deg)}
  .meta{flex:1;min-width:0}
  .name{display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:18px;line-height:1.2}
  .desc{display:block;color:var(--ink-soft);font-size:13.5px;font-weight:600;margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pill{
    flex-shrink:0;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
  }
  .pill.live{background:#e3f7ef;color:var(--live)}
  .pill.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live)}
  .pill.archived{background:#efedf4;color:#9a96ab}
  .arrow{flex-shrink:0;color:var(--peri);font-size:20px;font-weight:700;transition:transform .16s ease}
  .card:not(.archived):hover .arrow{transform:translateX(4px)}

  /* archived cards read quieter */
  .card.archived{background:#fbfaff;opacity:.78;cursor:default}
  .card.archived .tile{filter:grayscale(.35)}
  .card.archived .arrow{color:#bdb8cf}

  footer{text-align:center;margin-top:34px;color:var(--ink-soft);font-size:13px;font-weight:600}
  footer .heart{color:var(--coral)}

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    .hearts{display:none}
  }
</style>

<div class="flow"></div>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<div class="wrap">
  <header>
    <h1 class="mark">chanlix<span class="dot">.</span>love</h1>
    <p class="tag">Chanlix = Chan + Felix</p>
  </header>

  <div class="sites" id="sites"></div>

  <footer>
    made with <span class="heart">♥</span> · more pages coming soon
  </footer>
</div>

<script>
/* ============================================================
   YOUR SITES — add a new line here whenever you make a new page.
   Each one needs: name, url, emoji, and status ('live' or 'archived').
   ============================================================ */
const SITES = [
  {
    name:   'Cabin Trip 2026',
    url:    'https://cabin.chanlix.love',
    emoji:  '🏕️',
    status: 'live',
  },
  {
    name:   'Gov Ball',
    url:    'https://govball.chanlix.love',
    emoji:  '🎶',
    status: 'archived',
  },
  // To add another page, copy a block above and change the details:
  // { name:'New Page', url:'https://new.chanlix.love', emoji:'✨', status:'live' },
];
/* ============================================================ */

const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('sites').innerHTML = SITES.map(s=>{
  const archived = s.status === 'archived';
  const label = archived ? 'Archived' : 'Live';
  const inner =
    `<span class="tile" aria-hidden="true">${esc(s.emoji)}</span>`
  + `<span class="meta"><span class="name">${esc(s.name)}</span></span>`
  + `<span class="pill ${archived?'archived':'live'}">${label}</span>`
  + (archived ? '' : `<span class="arrow" aria-hidden="true">→</span>`);
  // Archived = static card (no link). Live = real link.
  return archived
    ? `<div class="card archived" aria-label="${esc(s.name)} — archived">${inner}</div>`
    : `<a class="card" href="${esc(s.url)}" target="_blank" rel="noopener" aria-label="${esc(s.name)} — live">${inner}</a>`;
}).join('');

/* ---- falling pastel hearts ---- */
const HEART_COLORS = [
  '#ff7aa2','#ff97b6','#ffb0c7','#ffc6d8','#ffdde8',   // pink → light pink
  '#dbe7ff','#c2d6ff','#a9c5ff','#8fb2ff','#7b9cff',   // light blue → blue
];
const HEART_PATH = 'M16 29.5C16 29.5 2 21.6 2 11.9 2 7 5.8 3.5 10 3.5c2.6 0 4.9 1.3 6 3.3 1.1-2 3.4-3.3 6-3.3 4.2 0 8 3.5 8 8.4 0 9.7-14 17.6-14 17.6z';
const rand = (a,b)=>a+Math.random()*(b-a);
const heartCount = window.innerWidth < 560 ? 22 : 34;
let hh = '';
for(let i=0;i<heartCount;i++){
  const c = HEART_COLORS[i % HEART_COLORS.length];        // cycle so all 10 shades appear
  const size = rand(11,36), left = rand(0,100);           // wide size range
  const dur = rand(5,12), delay = -rand(0,dur);           // negative delay = already mid-fall on load
  const sway = rand(2.4,4.6), sdelay = -rand(0,sway);
  const op = rand(0.45,0.95).toFixed(2);                  // wide opacity range
  hh += `<span class="heart" style="left:${left.toFixed(2)}vw;width:${size.toFixed(0)}px;height:${size.toFixed(0)}px;animation-duration:${dur.toFixed(2)}s;animation-delay:${delay.toFixed(2)}s">`
      + `<svg viewBox="0 0 32 33" xmlns="http://www.w3.org/2000/svg" style="animation-duration:${sway.toFixed(2)}s;animation-delay:${sdelay.toFixed(2)}s;opacity:${op}"><path fill="${c}" d="${HEART_PATH}"/></svg>`
      + `</span>`;
}
const heartsEl = document.getElementById('hearts');
heartsEl.innerHTML = hh;

/* show hearts across the whole top band, fading them out at the header's bottom edge
   (nothing below the header, so the cards stay clear and easy to tap) */
const headerEl = document.querySelector('header');
function sizeHearts(){
  if(!headerEl) return;
  const bottom = headerEl.getBoundingClientRect().bottom + window.scrollY; // header bottom in document px
  heartsEl.style.height = bottom + 'px';
  heartsEl.style.setProperty('--h', bottom + 'px');
  const fade = 90;                                      // soft fade zone right at the header's base
  const g = `linear-gradient(to bottom, #000 0, #000 ${Math.max(0,bottom-fade)}px, transparent ${bottom}px)`;
  heartsEl.style.webkitMaskImage = g;
  heartsEl.style.maskImage = g;
}
sizeHearts();
addEventListener('resize', sizeHearts, {passive:true});
addEventListener('load', sizeHearts, {passive:true});
</script>
